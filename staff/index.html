<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypase Staff</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #1a1a1a;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-container img {
            height: 32px;
            width: auto;
            opacity: 0.9;
            transition: opacity 0.3s ease;
        }

        .logo-container img:hover {
            opacity: 1;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #9b59b6;
            font-family: 'JetBrains Mono', monospace;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-links a {
            color: #cccccc;
            text-decoration: none;
            transition: color 0.3s ease;
            font-weight: 400;
        }

        .nav-links a:hover {
            color: #9b59b6;
        }

        main {
            margin-top: 80px;
            padding: 2rem 0;
        }

        .hero-section {
            min-height: 30vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem 0;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
            font-family: 'JetBrains Mono', monospace;
        }

        .hero-subtitle {
            font-size: 1.2rem;
            color: #9b59b6;
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .section {
            margin: 4rem 0;
        }

        .section-title {
            font-size: 2rem;
            margin-bottom: 2rem;
            color: #ffffff;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Staff Grid Styles */
        .staff-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .staff-card {
            background: #111111;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            text-align: center;
        }

        .staff-card:hover {
            border-color: #9b59b6;
            transform: translateY(-4px);
            background: #151515;
        }

        .staff-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 1rem;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b59b6;
            font-size: 2.5rem;
            border: 2px solid #9b59b6;
        }

        .staff-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .staff-role {
            font-size: 1rem;
            color: #9b59b6;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .staff-description {
            color: #cccccc;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .staff-contact {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }

        .staff-contact a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #1a1a1a;
            color: #cccccc;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid #2a2a2a;
        }

        .staff-contact a:hover {
            background: #2a2a2a;
            color: #9b59b6;
            transform: translateY(-2px);
        }

        /* Role Filter Styles */
        .filter-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            background: #1a1a1a;
            color: #cccccc;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'JetBrains Mono', monospace;
        }

        .filter-btn:hover {
            background: #2a2a2a;
            color: #9b59b6;
        }

        .filter-btn.active {
            background: #9b59b6;
            color: #ffffff;
            border-color: #9b59b6;
        }

        footer {
            text-align: center;
            padding: 3rem 0;
            color: #666666;
            border-top: 1px solid #1a1a1a;
            margin-top: 4rem;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2rem;
            }
            
            .nav-links {
                display: none;
            }
            
            .logo-container {
                flex-direction: column;
                gap: 0.5rem;
                align-items: flex-start;
            }

            .staff-grid {
                grid-template-columns: 1fr;
            }
        }

        .scroll-fade {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }

        .scroll-fade.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Server Badges */
        .server-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .server-badge {
            background: #1a1a1a;
            color: #9b59b6;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            border: 1px solid #2a2a2a;
        }

        .rank-badge {
            display: inline-block;
            background: linear-gradient(45deg, #9b59b6, #8e44ad);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
    </style>

        // Function to render staff cards
        function renderStaffCards(staff) {
            const container = document.getElementById('staffContainer');
            container.innerHTML = '';
            
            staff.forEach(member => {
                const card = document.createElement('div');
                card.className = 'staff-card scroll-fade';
                card.setAttribute('data-dept', member.department);
                
                // Create server badges
                const serverBadges = member.servers.map(server => 
                    `<span class="server-badge">${server}</span>`
                ).join('');
                
                card.innerHTML = `
                    <div class="staff-avatar">${member.avatar}</div>
                    <div class="rank-badge">${member.role}</div>
                    <h3 class="staff-name">${member.name}</h3>
                    <p class="staff-description">${member.description}</p>
                    <div class="staff-info">
                        <p><strong>Discord:</strong> ${member.discord}</p>
                        ${member.ign ? `<p><strong>IGN:</strong> ${member.ign}</p>` : ''}
                        ${member.steam64 ? `<p><strong>Steam64:</strong> ${member.steam64}</p>` : ''}
                    </div>
                    <div class="server-badges">
                        ${serverBadges}
                    </div>
                    <div class="staff-contact">
                        ${member.discord ? `<a href="#" title="Discord: ${member.discord}">💬</a>` : ''}
                        ${member.steam ? `<a href="${member.steam}" target="_blank" title="Steam Profile">🎮</a>` : ''}
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            // Add scroll animation observers
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.scroll-fade').forEach(el => {
                observer.observe(el);
            });
        }

        // Filter functionality
        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(button => {
                button.addEventListener('click', () => {
                    // Update active button
                    filterButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    
                    // Filter staff
                    const filter = button.getAttribute('data-filter');
                    let filteredStaff;
                    
                    if (filter === 'all') {
                        filteredStaff = staffData;
                    } else {
                        filteredStaff = staffData.filter(member => member.department === filter);
                    }
                    
                    renderStaffCards(filteredStaff);
                });
            });
        }

        // Initialize the page
        document.addEventListener('DOMContentLoaded', () => {
            renderStaffCards(staffData);
            setupFilters();
            
            // Smooth scrolling for navigation
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        target.scrollIntoView({
                            behavior: 'smooth',
                            block: 'start'
                        });
                    }
                });
            });
        });
