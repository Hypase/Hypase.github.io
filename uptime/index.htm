<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status - Hypase Life RP</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --darker: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --gray-light: #cbd5e1;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--light);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .dashboard {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            padding: 40px 30px 30px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--success) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--gray-light);
        }

        .status-card {
            padding: 30px;
        }

        .server-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .server-name {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status-up {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-down {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .uptime-value {
            color: var(--success);
        }

        .response-value {
            color: var(--primary);
        }

        .stat-label {
            color: var(--gray-light);
            font-size: 0.9rem;
        }

        .uptime-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1rem;
            margin-bottom: 12px;
            color: var(--gray-light);
        }

        .uptime-bar {
            height: 8px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .uptime-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success) 0%, var(--primary) 100%);
            border-radius: 4px;
            transition: width 1s ease;
        }

        .uptime-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: var(--gray-light);
        }

        .history-section {
            margin-bottom: 20px;
        }

        .history-days {
            display: flex;
            gap: 8px;
        }

        .day {
            flex: 1;
            height: 40px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .day-up {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .day-down {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .day-date {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .last-updated {
            text-align: center;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border);
            color: var(--gray);
            font-size: 0.9rem;
        }

        .auto-update {
            color: var(--primary);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--gray);
        }

        .spinner {
            border: 3px solid rgba(100, 116, 139, 0.3);
            border-radius: 50%;
            border-top: 3px solid var(--primary);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .server-info {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard">
            <div class="header">
                <h1>📊 Server Status</h1>
                <p class="subtitle">Hypase Life RP Server Monitoring</p>
            </div>
            
            <div class="status-card">
                <div class="server-info">
                    <div class="server-name">Hypase Life RP Server</div>
                    <div class="status-badge status-up" id="status-badge">ONLINE</div>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value uptime-value" id="uptime-value">99.65%</div>
                        <div class="stat-label">30-Day Uptime</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value response-value" id="response-value">28ms</div>
                        <div class="stat-label">Avg Response Time</div>
                    </div>
                </div>
                
                <div class="uptime-section">
                    <div class="section-title">Uptime Performance</div>
                    <div class="uptime-bar">
                        <div class="uptime-fill" id="uptime-bar" style="width: 99.65%"></div>
                    </div>
                    <div class="uptime-text">
                        <span>0%</span>
                        <span>100%</span>
                    </div>
                </div>
                
                <div class="history-section">
                    <div class="section-title">Last 7 Days</div>
                    <div class="history-days" id="history-days">
                        <!-- History will be populated by JavaScript -->
                    </div>
                </div>
            </div>
            
            <div class="last-updated">
                Last updated: <span id="last-updated-time">--</span>
                <span class="auto-update">• Auto-updates every 5 minutes</span>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const UPDATE_INTERVAL = 5 * 60 * 1000; // 5 minutes
        
        // Server data
        const serverData = {
            name: "Hypase Life RP Server",
            uptime: "99.6475%",
            responseTime: "28ms",
            status: "up",
            history: ["up", "up", "up", "up", "up", "up", "up"]
        };

        // Initialize the dashboard
        function initDashboard() {
            updateServerStatus();
            setInterval(updateServerStatus, UPDATE_INTERVAL);
        }

        // Update server status display
        function updateServerStatus() {
            // Update main stats
            document.getElementById('uptime-value').textContent = serverData.uptime;
            document.getElementById('response-value').textContent = serverData.responseTime;
            document.getElementById('uptime-bar').style.width = serverData.uptime;
            
            // Update status badge
            const statusBadge = document.getElementById('status-badge');
            if (serverData.status === 'up') {
                statusBadge.textContent = 'ONLINE';
                statusBadge.className = 'status-badge status-up';
            } else {
                statusBadge.textContent = 'OFFLINE';
                statusBadge.className = 'status-badge status-down';
            }
            
            // Update history
            updateHistoryDisplay();
            
            // Update timestamp
            document.getElementById('last-updated-time').textContent = new Date().toLocaleString();
            
            // Simulate occasional status changes for demo
            // In production, you would fetch real data from HetrixTools
            simulateStatusChange();
        }

        // Update history day display
        function updateHistoryDisplay() {
            const historyContainer = document.getElementById('history-days');
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            
            // Get dates for the last 7 days
            const dates = [];
            for (let i = 6; i >= 0; i--) {
                const date = new Date();
                date.setDate(date.getDate() - i);
                dates.push(date.getDate());
            }
            
            let historyHTML = '';
            serverData.history.forEach((status, index) => {
                const dayClass = status === 'up' ? 'day-up' : 'day-down';
                const daySymbol = status === 'up' ? '✓' : '✗';
                historyHTML += `
                    <div class="day ${dayClass}">
                        <div>${daySymbol}</div>
                        <div class="day-date">${dates[index]}</div>
                    </div>
                `;
            });
            
            historyContainer.innerHTML = historyHTML;
        }

        // Simulate occasional status changes for demo purposes
        // Remove this in production and replace with real HetrixTools API calls
        function simulateStatusChange() {
            // 5% chance to simulate a status change for demo
            if (Math.random() < 0.05) {
                serverData.status = serverData.status === 'up' ? 'down' : 'up';
                
                // Also randomly update one day in history
                const randomIndex = Math.floor(Math.random() * serverData.history.length);
                serverData.history[randomIndex] = serverData.history[randomIndex] === 'up' ? 'down' : 'up';
                
                // Update uptime based on history
                const upCount = serverData.history.filter(day => day === 'up').length;
                const newUptime = (upCount / serverData.history.length * 100).toFixed(2);
                serverData.uptime = newUptime + '%';
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
