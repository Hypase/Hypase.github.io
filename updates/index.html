<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EWA Generator Tools</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.imgur.com/5wQ4OzF.jpeg');
            background-size: 800px 800px;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ffd93d 100%);
            color: white;
            padding: 40px;
            text-align: center;
            border-bottom: 5px solid #ff5252;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            font-weight: 800;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 3px solid #ffd93d;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            background: #e0e0e0;
            color: #666;
            transition: all 0.3s;
            border: none;
        }

        .tab.active {
            background: white;
            color: #ff5252;
            border-bottom: 4px solid #ff5252;
        }

        .tab:hover {
            background: #f0f0f0;
        }

        .content {
            padding: 40px;
            display: none;
        }

        .content.active {
            display: block;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #ff5252;
            margin-bottom: 8px;
            font-size: 1.1em;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 3px solid #ffd93d;
            border-radius: 10px;
            font-size: 1em;
            font-family: inherit;
            transition: all 0.3s;
            margin-bottom: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.1);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            padding: 18px 30px;
            font-size: 1.1em;
            font-weight: 700;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .generate-btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.4);
        }

        .copy-btn {
            background: linear-gradient(135deg, #ffd93d 0%, #ffc107 100%);
            color: #333;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, #ffc107 0%, #ffb300 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 217, 61, 0.4);
        }

        .discord-btn {
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
            color: white;
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .discord-btn:hover {
            background: linear-gradient(135deg, #4752C4 0%, #3C45A5 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
        }

        .output-section {
            background: #fff9e6;
            border: 3px solid #ffd93d;
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
        }

        .output-section h2 {
            color: #ff5252;
            margin-bottom: 15px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .discord-preview {
            background: #36393f;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            color: #dcddde;
            font-family: 'Whitney', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        .discord-preview h3 {
            color: #ffd93d;
            font-size: 1.3em;
            margin-bottom: 10px;
        }

        pre {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            border: 2px solid #ff6b6b;
        }

        .info-box {
            background: #e8f5e9;
            border: 2px solid #4caf50;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            color: #2e7d32;
        }

        .info-box strong {
            color: #1b5e20;
        }

        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4caf50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .update-item, .todo-item {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            gap: 10px;
            align-items: start;
            margin-bottom: 10px;
        }

        .update-item button, .todo-item button {
            padding: 5px 10px;
            font-size: 0.9em;
            background: #ff5252;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .update-item button:hover, .todo-item button:hover {
            background: #ff3838;
        }

        .add-item-btn {
            background: #4caf50 !important;
            margin-top: 10px;
            padding: 10px 20px !important;
            font-size: 1em !important;
        }

        .add-item-btn:hover {
            background: #45a049 !important;
        }

        .priority-select {
            padding: 5px 10px;
            border: 2px solid #ffd93d;
            border-radius: 5px;
            font-size: 0.9em;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 EWA TOOLS 🔥</h1>
            <p>Update & To-Do Generator</p>
        </div>
        
        <div class="tabs">
            <button class="tab active" data-tab="updates">📄 Updates</button>
            <button class="tab" data-tab="todo">✅ To-Do List</button>
        </div>

        <!-- UPDATES TAB -->
        <div id="updates-content" class="content active">
            <div class="info-box">
                <strong>📢 How to use:</strong> Fill in the fields below, add your updates, then generate and copy to Discord or use Discohook!
            </div>

            <div class="input-section">
                <label for="version">Version Number:</label>
                <input type="text" id="version" placeholder="e.g., 1.2.5" value="X.XX.X">
            </div>

            <div class="input-section">
                <label for="category">Update Category:</label>
                <input type="text" id="category" placeholder="e.g., NEW FEATURES, BUG FIXES, IMPROVEMENTS">
            </div>

            <div class="input-section">
                <label for="description">Category Description:</label>
                <input type="text" id="description" placeholder="e.g., Major gameplay enhancements">
            </div>

            <div class="input-section">
                <label for="subcategory">Update Subcategory (Optional):</label>
                <input type="text" id="subcategory" placeholder="e.g., Player Systems">
            </div>

            <div class="input-section">
                <label>Update Items:</label>
                <div id="updatesList"></div>
                <button class="add-item-btn" onclick="addUpdateField()">+ Add Update Item</button>
            </div>

            <div class="input-section">
                <label for="additional">Additional Information (Optional):</label>
                <textarea id="additional" placeholder="e.g., Thanks for playing! More updates coming soon..."></textarea>
            </div>

            <div class="button-group">
                <button class="generate-btn" onclick="generateUpdate()">
                    ⚡ Generate Update
                </button>
                <button class="copy-btn" id="copyBtn" onclick="copyToClipboard('update')" style="display: none;">
                    📋 Copy to Clipboard
                </button>
                <button class="discord-btn" onclick="openDiscohook('update')" style="display: none;" id="discohookBtn">
                    <svg width="24" height="24" viewBox="0 0 71 55" fill="white">

                    </svg>
                    Open in Discohook
                </button>
            </div>

            <div id="updateOutput"></div>
        </div>

        <!-- TODO TAB -->
        <div id="todo-content" class="content">
            <div class="info-box">
                <strong>✅ How to use:</strong> Add your tasks with priorities and due dates, then generate a formatted to-do list for Discord!
            </div>

            <div class="input-section">
                <label for="todoTitle">To-Do List Title:</label>
                <input type="text" id="todoTitle" placeholder="e.g., EWA Development Tasks" value="EWA To-Do List">
            </div>

            <div class="input-section">
                <label for="todoDate">Date/Week:</label>
                <input type="text" id="todoDate" placeholder="e.g., Week of Jan 15, 2025">
            </div>

            <div class="input-section">
                <label for="todoCategory">Category (Optional):</label>
                <input type="text" id="todoCategory" placeholder="e.g., Development, Design, Testing">
            </div>

            <div class="input-section">
                <label>Tasks:</label>
                <div id="todoList"></div>
                <button class="add-item-btn" onclick="addTodoField()">+ Add Task</button>
            </div>

            <div class="input-section">
                <label for="todoNotes">Notes (Optional):</label>
                <textarea id="todoNotes" placeholder="Additional notes or reminders..."></textarea>
            </div>

            <div class="button-group">
                <button class="generate-btn" onclick="generateTodo()">
                    ⚡ Generate To-Do List
                </button>
                <button class="copy-btn" id="todoCopyBtn" onclick="copyToClipboard('todo')" style="display: none;">
                    📋 Copy to Clipboard
                </button>
                <button class="discord-btn" onclick="openDiscohook('todo')" style="display: none;" id="todoDiscohookBtn">
                    <svg width="24" height="24" viewBox="0 0 71 55" fill="white">
                        <path d="M60.1045 4.8978C55.5792 2.8214 50.7265 1.2916 45.6527 0.41542C45.5603 0.39851 45.468 0.440769 45.4204 0.525289C44.7963 1.6353 44.105 3.0834 43.6209 4.2216C38.1637 3.4046 32.7345 3.4046 27.3892 4.2216C26.905 3.0581 26.1886 1.6353 25.5617 0.525289C25.5141 0.443589 25.4218 0.40133 25.3294 0.41542C20.2584 1.2888 15.4057 2.8186 10.8776 4.8978C10.8384 4.9147 10.8048 4.9429 10.7825 4.9795C1.57795 18.7309 -0.943561 32.1443 0.293408 45.3914C0.299005 45.4562 0.335386 45.5182 0.385761 45.5576C6.45866 50.0174 12.3413 52.7249 18.1147 54.5195C18.2071 54.5477 18.305 54.5139 18.3638 54.4378C19.7295 52.5728 20.9469 50.6063 21.9907 48.5383C22.0523 48.4172 21.9935 48.2735 21.8676 48.2256C19.9366 47.4931 18.0979 46.6 16.3292 45.5858C16.1893 45.5041 16.1781 45.304 16.3068 45.2082C16.679 44.9293 17.0513 44.6391 17.4067 44.3461C17.471 44.2926 17.5606 44.2813 17.6362 44.3151C29.2558 49.6202 41.8354 49.6202 53.3179 44.3151C53.3935 44.2785 53.4831 44.2898 53.5502 44.3433C53.9057 44.6363 54.2779 44.9293 54.6529 45.2082C54.7816 45.304 54.7732 45.5041 54.6333 45.5858C52.8646 46.6197 51.0259 47.4931 49.0921 48.2228C48.9662 48.2707 48.9102 48.4172 48.9718 48.5383C50.038 50.6034 51.2554 52.5699 52.5959 54.435C52.6519 54.5139 52.7526 54.5477 52.845 54.5195C58.6464 52.7249 64.529 50.0174 70.6019 45.5576C70.6551 45.5182 70.6887 45.459 70.6943 45.3942C72.1747 30.0791 68.2147 16.7757 60.1968 4.9823C60.1772 4.9429 60.1437 4.9147 60.1045 4.8978ZM23.7259 37.3253C20.2276 37.3253 17.3451 34.1136 17.3451 30.1693C17.3451 26.225 20.1717 23.0133 23.7259 23.0133C27.308 23.0133 30.1626 26.2532 30.1066 30.1693C30.1066 34.1136 27.28 37.3253 23.7259 37.3253ZM47.3178 37.3253C43.8196 37.3253 40.9371 34.1136 40.9371 30.1693C40.9371 26.225 43.7636 23.0133 47.3178 23.0133C50.9 23.0133 53.7545 26.2532 53.6986 30.1693C53.6986 34.1136 50.9 37.3253 47.3178 37.3253Z"/>
                    </svg>
                    Open in Discohook
                </button>
            </div>

            <div id="todoOutput"></div>
        </div>
    </div>

    <script>
        let updateCount = 0;
        let todoCount = 0;

        // Initialize after DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Tab switching
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const targetTab = this.getAttribute('data-tab');
                    
                    // Remove active from all tabs
                    tabs.forEach(t => t.classList.remove('active'));
                    // Add active to clicked tab
                    this.classList.add('active');
                    
                    // Hide all content
                    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
                    // Show target content
                    document.getElementById(targetTab + '-content').classList.add('active');
                });
            });

            // Initialize with some fields
            addUpdateField();
            addUpdateField();
            addUpdateField();
            addTodoField();
            addTodoField();
            addTodoField();
        });

        // UPDATE FUNCTIONS
        function addUpdateField() {
            updateCount++;
            const updatesList = document.getElementById('updatesList');
            const updateItem = document.createElement('div');
            updateItem.className = 'update-item';
            updateItem.id = `update-${updateCount}`;
            updateItem.innerHTML = `
                <span>${updateCount}.</span>
                <input type="text" placeholder="Update information..." style="margin: 0;">
                <button onclick="removeUpdate(${updateCount})">✕</button>
            `;
            updatesList.appendChild(updateItem);
        }

        function removeUpdate(id) {
            document.getElementById(`update-${id}`).remove();
            renumberUpdates();
        }

        function renumberUpdates() {
            const items = document.querySelectorAll('.update-item');
            items.forEach((item, index) => {
                item.querySelector('span').textContent = `${index + 1}.`;
            });
        }

        function generateUpdate() {
            const version = document.getElementById('version').value.trim() || 'X.XX.X';
            const category = document.getElementById('category').value.trim();
            const description = document.getElementById('description').value.trim();
            const subcategory = document.getElementById('subcategory').value.trim();
            const additional = document.getElementById('additional').value.trim();
            
            const updateInputs = document.querySelectorAll('.update-item input');
            const updates = Array.from(updateInputs)
                .map(input => input.value.trim())
                .filter(val => val !== '');

            if (!category) {
                alert('⚠️ Please enter at least a category!');
                return;
            }

            if (updates.length === 0) {
                alert('⚠️ Please add at least one update item!');
                return;
            }

            let output = `# Summit Falls Development Update\n-# Version ${version}\n## ${category.toUpperCase()}\n`;
            
            if (description) {
                output += `*${description}*\n`;
            }
            
            if (subcategory) {
                output += `## ${subcategory}\n`;
            }
            
            updates.forEach((update, index) => {
                if (additional && index === updates.length - 1) {
                    output += `-#   Additional Information\n`;
                }
                output += `${index + 1}. | *${update}*\n`;
            });
            
            if (additional && updates.length > 0) {
                output += `\n*${additional}*`;
            }

            const outputDiv = document.getElementById('updateOutput');
            outputDiv.innerHTML = `
                <div class="output-section">
                    <h2>📄 Your EWA Update</h2>
                    <div class="discord-preview">
                        <h3>Discord Preview</h3>
                        <pre style="background: #2f3136; color: #dcddde; border: none;">${output}</pre>
                    </div>
                    <pre>${output}</pre>
                </div>
            `;

            document.getElementById('copyBtn').style.display = 'block';
            document.getElementById('discohookBtn').style.display = 'flex';
            window.generatedUpdate = output;
        }

        // TODO FUNCTIONS
        function addTodoField() {
            todoCount++;
            const todoList = document.getElementById('todoList');
            const todoItem = document.createElement('div');
            todoItem.className = 'todo-item';
            todoItem.id = `todo-${todoCount}`;
            todoItem.innerHTML = `
                <span>☐</span>
                <input type="text" placeholder="Task description..." style="margin: 0;">
                <select class="priority-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                    <option value="urgent">🔥 Urgent</option>
                </select>
                <button onclick="removeTodo(${todoCount})">✕</button>
            `;
            todoList.appendChild(todoItem);
        }

        function removeTodo(id) {
            document.getElementById(`todo-${id}`).remove();
        }

        function generateTodo() {
            const title = document.getElementById('todoTitle').value.trim() || 'EWA To-Do List';
            const date = document.getElementById('todoDate').value.trim();
            const category = document.getElementById('todoCategory').value.trim();
            const notes = document.getElementById('todoNotes').value.trim();
            
            const todoItems = document.querySelectorAll('.todo-item');
            const tasks = [];
            
            todoItems.forEach(item => {
                const text = item.querySelector('input').value.trim();
                const priority = item.querySelector('select').value;
                if (text) {
                    tasks.push({ text, priority });
                }
            });

            if (tasks.length === 0) {
                alert('⚠️ Please add at least one task!');
                return;
            }

            // Sort by priority
            const priorityOrder = { urgent: 0, high: 1, medium: 2, low: 3 };
            tasks.sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority]);

            let output = `# ${title}\n`;
            if (date) output += `📅 *${date}*\n`;
            output += `\n`;
            
            if (category) {
                output += `## ${category}\n`;
            }

            tasks.forEach(task => {
                const emoji = task.priority === 'urgent' ? '🔥' : 
                             task.priority === 'high' ? '⚠️' : 
                             task.priority === 'medium' ? '📌' : '📋';
                output += `☐ ${emoji} ${task.text}\n`;
            });

            if (notes) {
                output += `\n---\n📝 *Notes: ${notes}*`;
            }

            const outputDiv = document.getElementById('todoOutput');
            outputDiv.innerHTML = `
                <div class="output-section">
                    <h2>✅ Your To-Do List</h2>
                    <div class="discord-preview">
                        <h3>Discord Preview</h3>
                        <pre style="background: #2f3136; color: #dcddde; border: none;">${output}</pre>
                    </div>
                    <pre>${output}</pre>
                </div>
            `;

            document.getElementById('todoCopyBtn').style.display = 'block';
            document.getElementById('todoDiscohookBtn').style.display = 'flex';
            window.generatedTodo = output;
        }

        // SHARED FUNCTIONS
        function copyToClipboard(type) {
            const text = type === 'update' ? window.generatedUpdate : window.generatedTodo;
            navigator.clipboard.writeText(text).then(() => {
                showNotification('✅ Copied to clipboard!');
                const btn = type === 'update' ? document.getElementById('copyBtn') : document.getElementById('todoCopyBtn');
                const originalText = btn.innerHTML;
                btn.innerHTML = '✅ Copied!';
                setTimeout(() => {
                    btn.innerHTML = originalText;
                }, 2000);
            });
        }

        function openDiscohook(type) {
            const text = type === 'update' ? window.generatedUpdate : window.generatedTodo;
            const encoded = encodeURIComponent(text);
            const discohookUrl = `https://discohook.org/?data=${encoded}`;
            window.open(discohookUrl, '_blank');
            showNotification('🚀 Opening Discohook...');
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => notification.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
